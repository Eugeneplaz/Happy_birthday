<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You 💌</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:radial-gradient(ellipse at bottom,#3a1250 0%,#14052a 60%,#05010d 100%);color:#fff;font-family:Georgia,serif;overflow:hidden}
canvas{position:fixed;inset:0;z-index:0}
.scene{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;overflow-y:auto}
.scene.on{display:flex;animation:fade 1.2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hand{font-family:"Segoe Script","Brush Script MT",cursive}
button{background:linear-gradient(135deg,#ff9ac1,#ff5e98);color:#fff;border:0;border-radius:30px;padding:13px 28px;font-size:1.05rem;margin-top:22px;cursor:pointer;box-shadow:0 0 20px #ff5e9888;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.hint{opacity:.75;margin-top:18px;font-size:.95rem;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.25}}
.env{position:relative;width:260px;height:170px;background:#f7d7e4;border-radius:6px;cursor:pointer;box-shadow:0 0 40px #ff7ab788;margin-top:30px}
.env .flap{position:absolute;top:0;left:0;width:0;height:0;border-left:130px solid transparent;border-right:130px solid transparent;border-top:100px solid #eab2cb;transform-origin:top;transition:transform 1s;z-index:3}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env .front{position:absolute;inset:0;z-index:2;background:linear-gradient(135deg,transparent 49%,#efc0d4 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49%,#efc0d4 50%) right/50% 100% no-repeat;border-radius:6px}
.env .note{position:absolute;left:15px;right:15px;top:10px;height:140px;background:#fff;color:#a0245f;border-radius:4px;z-index:1;display:flex;align-items:center;justify-content:center;font-size:1.4rem;transition:transform 1.2s .6s}
.env.open .note{transform:translateY(-90px)}
.seal{position:absolute;top:78px;left:115px;font-size:30px;z-index:4;transition:opacity .4s}
.env.open .seal{opacity:0}
.cake{position:relative;width:200px;height:170px;margin-top:70px}
.l{position:absolute;left:50%;transform:translateX(-50%);border-radius:10px}
.l1{bottom:0;width:200px;height:60px;background:#ff8fb8}
.l2{bottom:60px;width:150px;height:50px;background:#ffc2d9}
.l3{bottom:110px;width:100px;height:40px;background:#fff0f5}
.drip{position:absolute;bottom:105px;left:50%;transform:translateX(-50%);width:150px;height:14px;background:repeating-linear-gradient(90deg,#fff 0 18px,transparent 18px 30px);border-radius:0 0 10px 10px}
.candle{position:absolute;bottom:150px;left:50%;margin-left:-5px;width:10px;height:42px;background:repeating-linear-gradient(#ffe066 0 8px,#fff 8px 16px);border-radius:3px;cursor:pointer}
.flame{position:absolute;top:-26px;left:-4px;width:18px;height:28px;background:radial-gradient(#fff 15%,#ffd24d 50%,#ff7a00);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;box-shadow:0 0 25px 10px #ffb34788;animation:flick .3s infinite alternate;transition:opacity .5s}
@keyframes flick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.12,.95) rotate(3deg)}}
.off .flame{opacity:0}
.balloon{position:fixed;bottom:-80px;font-size:54px;z-index:2;animation:up linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-120vh) rotate(15deg)}}
.pol{background:#fff;padding:12px 12px 46px;border-radius:4px;box-shadow:0 12px 35px #000a;width:min(78vw,310px);transform:rotate(var(--r,-3deg));animation:drop 1.1s cubic-bezier(.2,1.4,.4,1);position:relative}
.pol img{width:100%;height:min(88vw,360px);object-fit:cover;display:block}
.pol .cap{position:absolute;bottom:12px;left:0;right:0;color:#555;font-size:1.05rem}
@keyframes drop{from{opacity:0;transform:translateY(-120vh) rotate(25deg)}}
#msg{max-width:440px;margin-top:24px;font-size:1.08rem;line-height:1.75;min-height:130px;text-shadow:0 0 12px #000}
.paper{background:#fff9ee;color:#4a2a2a;max-width:460px;width:100%;padding:28px 24px;border-radius:6px;box-shadow:0 0 50px #ff9ac144;text-align:left;max-height:72vh;overflow-y:auto;scroll-behavior:smooth}
.paper p{opacity:0;transform:translateY(10px);transition:all 1.6s;font-size:1.15rem;line-height:1.85;margin-bottom:16px}
.paper p.v{opacity:1;transform:none}
.wall{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:560px;margin-bottom:14px}
.wall .pol{width:100px;padding:5px 5px 18px;animation:float 4s ease-in-out infinite}
.wall .pol img{height:100px}
@keyframes float{50%{transform:translateY(-10px) rotate(calc(var(--r)*-1))}}
.big{font-size:2.3rem;line-height:1.3;background:linear-gradient(90deg,#ffd1e6,#fff,#ff9ac1);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #ff5e98)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="scene on" id="s1">
  <h2 class="hand" style="font-size:1.7rem">This message is for you...</h2>
  <div class="env" id="env" onclick="openEnv()">
    <div class="flap"></div><div class="front"></div><div class="seal">💌</div>
    <div class="note hand" id="to"></div>
  </div>
  <p class="hint">Tap</p>
</div>

<div class="scene" id="s2">
  <h2 class="hand" style="font-size:1.7rem">Make a wish ✨</h2>
  <div class="cake" id="cake">
    <div class="l l1"></div><div class="l l2"></div><div class="l l3"></div><div class="drip"></div>
    <div class="candle" onclick="blow()"><div class="flame"></div></div>
  </div>
  <p class="hint" id="h2">Close your eyes, then tap the candle fire</p>
  <button id="b2" style="display:none" onclick="startMem()">Continue 💫</button>
</div>

<div class="scene" id="s3">
  <div class="pol" id="pol"><img id="img" alt=""><div class="cap hand" id="cap"></div></div>
  <p id="msg"></p>
  <button id="b3" style="display:none" onclick="nextMem()">Next</button>
</div>

<div class="scene" id="s4">
  <h2 class="hand" style="font-size:1.6rem;margin-bottom:14px">Naay lain pa… 💗</h2>
  <div class="paper hand" id="paper"></div>
  <button id="b4" style="display:none" onclick="finale()">The last </button>
</div>

<div class="scene" id="s5">
  <div class="wall" id="wall"></div>
  <div class="big hand">Happy Birthday,<br><span id="nm"></span>! 🎂</div>
  <p style="margin-top:16px;max-width:380px;line-height:1.7">Thank you for staying with me 🥹<br>Swerte kaayo ko nimo. 💖</p>
  <button onclick="location.reload()">Tan-awa pag usab</button>
</div>

<audio id="song" src="music.mp3" loop></audio>

<script>
const NAME = "Babyy";
const photos = ["photo1.jpg","photo2.png","photo3.jpeg","photo4.png","photo5.jpeg"];
const captions = ["ikaw jud 🥹","ang imong smile, grabe","akong paborito","nindot as always","ikaw ra 💖"];
const parts = [
`Happy birthday, ${NAME}. 🎂 This is for you ${NAME} , so pasyensya ko kung dili perpekto. Gusto ra gyud nako nga mobati ka nga espesyal ka karong adlawa.`,
`Nagtan-aw ko ani nga picture, ngisi-ngisi ko nag-inusara, haha. Seryoso, nindot kaayo imong smile. Paborito nako na.`,
`Nahibalo ka ba unsay pinaka gusto nako nimo? Dili lang nga gwapa ka. Ang imong kabut'an sa ubang tao bahalag sa akoa dili, og imo pud pagka loyal sa akoa babyy unta mapadayun na, nya you're true to yourself.`,
`Bisan ang yano ra nga mga butang, atong random nga chats, ang atong corny nga jokes, og uban pa gipangbuhat natu nga nalingaw ta, mao na ang kanunay nakong mahinumdoman.`,
`Kini na ang katapusang picture. Unta makita sab nimo imong kaugalingon sama sa pagkakita nako nimo. Mas labaw pa kaysa imong gihunahuna. 💖`
];
const letter = [
`Hi ${NAME},`,
` Sorry, dili gyud ko maayo mosulti ani nga mga butang sa atubangan nimo. Maulaw ko, unya mahuman ra gyud sa kataw'anan hahaha. Maong diri na lang nako isuwat.`,
`Salamat kay naa ka gihapon bisan badlungon ko usahay. Salamat sa pagpasensya nako inig bad mood ko, usahay rasad bitaw ko ma badmood, sa pagpaminaw bisan usahay wala nay sense akong gisulti nya saputon naka, pero love gihapon tika.`,
`Na appreciate nako ang mga gagmay nga butang nga imong gipangbuhat sa akoa og makadalag palipay sa akoa, nahibalo ka ana. Ang imong pagkumusta, ang imong paghinumdom sa mga butang nga ako mismo nakalimot na. Dili man permi nako masulti, pero na appreciate nako ang tanan. Dako kaayo na nga butang para nako babyy, I love you^^`,
`I know life isn't always kind to you. I know you carry things you don't tell anyone. So here is my promise: whenever you're tired, you can lean on me. You never have to be strong alone.I'm here for babyy through ups and down.`,
`On your birthday I wish you peace that stays, health that lasts, and a heart that is never empty. I wish every dream you've whispered at night comes true. You deserve all of it, and more.`,
`And if you ever forget how special you are, come back to this page. Read it again. Let it remind you that you are loved, you are wanted, and you are someone's whole favorite person.`,
`Happy birthday, ${NAME}. I love you. 💖`
];
  
const $=s=>document.querySelector(s), song=$("#song");
$("#to").textContent="Para kanimo, "+NAME+" 💖"; $("#nm").textContent=NAME;
function go(id){document.querySelectorAll(".scene").forEach(e=>e.classList.remove("on"));$(id).classList.add("on")}

const cv=$("#c"),x=cv.getContext("2d");let W,H;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener("resize",size);
const stars=Array.from({length:130},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.3,p:Math.random()*6}));
let sp=[],shoot=null;
function burst(px,py){const h=Math.random()*360;for(let i=0;i<70;i++){const a=Math.random()*6.28,v=Math.random()*5+1;sp.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:`hsl(${h+Math.random()*40},100%,65%)`})}}
function loop(t){
  x.clearRect(0,0,W,H);
  stars.forEach(s=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));x.fillStyle="#fff";x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,6.28);x.fill()});
  if(!shoot&&Math.random()<.004)shoot={x:Math.random()*W,y:0,l:1};
  if(shoot){x.globalAlpha=shoot.l;x.strokeStyle="#fff";x.lineWidth=2;x.beginPath();x.moveTo(shoot.x,shoot.y);x.lineTo(shoot.x-60,shoot.y-30);x.stroke();shoot.x+=14;shoot.y+=7;shoot.l-=.015;if(shoot.l<=0)shoot=null}
  sp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.011;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;x.fillRect(p.x,p.y,3,3)});
  sp=sp.filter(p=>p.l>0);x.globalAlpha=1;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function type(el,msg,done,speed=42){el.textContent="";let k=0;const t=setInterval(()=>{el.textContent+=msg[k++];if(k>=msg.length){clearInterval(t);done&&done()}},speed)}

function openEnv(){
  $("#env").classList.add("open");$(".hint").style.display="none";
  try{const pr=song.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}
  setTimeout(()=>{go("#s2")},2800);
}
let blown=false;
function blow(){
  if(blown)return;blown=true;$("#cake").classList.add("off");
  $("#h2").textContent="Nakawish naka? Unta matuman tanan ang imong gi-wish ✨";
  const emo=["🎈","🌹","🎈","🎉","🎊","🥹","🎂"];
  for(let i=0;i<14;i++)setTimeout(()=>{const b=document.createElement("div");b.className="balloon";b.textContent=emo[i%7];b.style.left=Math.random()*90+"vw";b.style.animationDuration=(5+Math.random()*4)+"s";document.body.appendChild(b);setTimeout(()=>b.remove(),10000)},i*220);
  for(let i=0;i<5;i++)setTimeout(()=>burst(Math.random()*W,Math.random()*H*.5+40),i*400);
  setTimeout(()=>$("#b2").style.display="inline-block",2500);
}
let i=0;
function showMem(){
  go("#s3");$("#b3").style.display="none";
  const p=$("#pol");p.style.setProperty("--r",(Math.random()*8-4)+"deg");p.style.animation="none";p.offsetHeight;p.style.animation="";
  $("#img").src=photos[i];$("#cap").textContent=captions[i]||"";
  setTimeout(()=>{burst(W/2,H*.3);type($("#msg"),parts[i],()=>{$("#b3").style.display="inline-block";$("#b3").textContent=i===4?"Read this letter 💌":"Next 💌"})},900);
}
function startMem(){i=0;showMem()}
function nextMem(){i++;i>4?startLetter():showMem()}
function startLetter(){
  go("#s4");const pa=$("#paper");pa.innerHTML="";
  letter.forEach(t=>{const p=document.createElement("p");p.textContent=t;pa.appendChild(p)});
  [...pa.children].forEach((p,k)=>setTimeout(()=>{p.classList.add("v");pa.scrollTop=pa.scrollHeight;if(k===letter.length-1)setTimeout(()=>$("#b4").style.display="inline-block",2000)},k*3600+500));
}
function finale(){
  go("#s5");const w=$("#wall");w.innerHTML="";
  photos.forEach((src,k)=>{const d=document.createElement("div");d.className="pol";d.style.setProperty("--r",(Math.random()*14-7)+"deg");d.style.animationDelay=((k+1)*.3)+"s";d.innerHTML=`<img src="${src}" alt="">`;w.appendChild(d)});
  setInterval(()=>burst(Math.random()*W,Math.random()*H*.6+30),700);
}
</script>
</body>
</html>
